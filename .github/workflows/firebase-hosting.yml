name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Deploy only once the FIREBASE_SERVICE_ACCOUNT secret has been added
      HAS_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        if: env.HAS_KEY == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: postre-mio
      - name: Skipped (no key)
        if: env.HAS_KEY != 'true'
        run: echo "FIREBASE_SERVICE_ACCOUNT secret not set; skipping deploy."
