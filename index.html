<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Postre Mío</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Postre Mío">
<meta name="theme-color" content="#7ED0D2">
<link rel="stylesheet" href="styles.css">
</head>

<body class="no-page-scroll">

<!-- AUTH GATE -->
<div id="authGate" class="auth-gate">
  <img src="logo.jpeg">
  <p class="auth-subtitle" id="authSubtitle">Ingresa el PIN para continuar</p>
  <div class="pin-dots" id="pinDots">
    <div class="pin-dot"></div>
    <div class="pin-dot"></div>
    <div class="pin-dot"></div>
    <div class="pin-dot"></div>
  </div>
  <div class="auth-error" id="authError"></div>
  <div class="numpad">
    <button class="numpad-btn" onclick="pinKey('1')">1</button>
    <button class="numpad-btn" onclick="pinKey('2')">2</button>
    <button class="numpad-btn" onclick="pinKey('3')">3</button>
    <button class="numpad-btn" onclick="pinKey('4')">4</button>
    <button class="numpad-btn" onclick="pinKey('5')">5</button>
    <button class="numpad-btn" onclick="pinKey('6')">6</button>
    <button class="numpad-btn" onclick="pinKey('7')">7</button>
    <button class="numpad-btn" onclick="pinKey('8')">8</button>
    <button class="numpad-btn" onclick="pinKey('9')">9</button>
    <button class="numpad-btn empty"></button>
    <button class="numpad-btn" onclick="pinKey('0')">0</button>
    <button class="numpad-btn backspace" onclick="pinBackspace()">⌫</button>
  </div>
  <div class="auth-version" id="authVersion"></div>
</div>

<div id="loadingScreen" class="loading-screen" style="display:none;">
  <img src="icon-192.png">
  <div class="loading-spinner"></div>
  <p id="loadingStatus" style="color:#fff;margin:16px 0 0;font-size:14px;opacity:0.9;"></p>
</div>

<div id="appShell" style="display:none;">

<div class="header">
  <button class="menu-btn" onclick="toggleMenu()">☰</button>
  <img src="logo.jpeg" onclick="logoClick(this)" style="cursor:pointer;">
  <span id="connBadge" class="conn-badge online">En línea</span>
</div>


<!-- 🟢 PÁGINA PRINCIPAL -->
<div id="posPage" class="page" style="display:block;">

  <div class="container">

    <div class="products" id="products"></div>

    <div class="cart">
      <h2 class="cart-title"><span id="cartIcon" class="cart-icon"></span> Orden</h2>
      <div class="cart-items" id="cart"></div>
      <div class="total">Total: $<span id="total">0</span></div>

      <button id="payBtn" class="pay" onclick="openPaymentOptions();">Cobrar</button>
      <button class="clear btn-icon" onclick="clearCart()"><span data-icon="cart"></span> Limpiar</button>
      <button class="btn-secondary btn-icon btn-pending" onclick="saveAsPending()"><span data-icon="clipboard"></span><span class="btn-label">Guardar como pendiente</span></button>
    </div>

  </div>

</div>

<!-- MODAL -->
<div id="modal" class="modal hidden">
  <div class="modal-content" id="modalContent"></div>
</div>

<!-- TICKET -->
<div id="ticketModal" style="
  display:none;
  position:fixed;
  top:10px; bottom:10px;
  left:10px; right:10px;
  width: 100%; height:100%;
  background:rgba(0,0,0,0.6);
  justify-content:center;
  align-items:center;
  z-index:9999;
">
  <div style="
    background:white;
    padding:20px;
    border-radius:10px;
    max-width:320px;
    width:90%;
    text-align:center;
  ">
  </div>
</div>

<!-- INVENTARIO -->
<div id="inventoryPage" class="page page-flow" style="display:none;">
  <div class="page-content">
    <h2 style="margin:0 0 4px;">Inventario</h2>
    <div id="inventoryList"></div>
    <button class="btn-brand" style="width:100%;margin-top:16px;font-size:14px;" onclick="openEditInventoryModal()"><span data-icon="pencil"></span> Editar inventario</button>
    <button id="bakeBtn" class="btn-brand" style="width:100%;margin-top:10px;font-size:14px;" onclick="openBakeModal()"><span data-icon="flame"></span> Hornear</button>
    <div class="restock-section" id="restockSection" style="display:none;">
      <h3><span data-icon="package"></span> Reabastecimientos</h3>
      <div id="restockList"></div>
      <div id="restockActions"></div>
    </div>
    <button class="btn-danger" style="width:100%;margin-top:16px;font-size:13px;" onclick="resetInventory()">Reset</button>
  </div>
</div>

<!-- HISTORIAL -->
<div id="historyPage" class="page page-flow" style="display:none;">
  <div class="page-content">
    <h2 style="margin:0 0 4px;">Historial</h2>
    <div id="historyList"></div>
    <div id="historyStats" class="history-stats" style="display:none;"></div>
    <div id="cutBtn" style="display:none; text-align: center;">
      <button onclick="generateCut()">Corte de caja</button>
    </div>
  </div>
</div>

<!-- ARCHIVO -->
<div id="archivePage" class="page page-flow" style="display:none;">
  <div class="page-content">
    <h2>Archivo</h2>
    <div id="archiveList"></div>
    <div id="archiveActions"></div>
  </div>
</div>

<!-- PROMOCIONES -->
<div id="promoPage" class="page page-flow" style="display:none;">
  <div class="page-content">
    <h2>Promociones</h2>
    <div class="promo-list" id="promoList"></div>
  </div>
</div>

<!-- PEDIDOS PENDIENTES -->
<div id="pendingPage" class="page page-flow" style="display:none;">
  <div class="page-content">
    <h2>Pedidos pendientes</h2>
    <div class="promo-list" id="pendingList"></div>
  </div>
</div>

<!-- AJUSTES -->
<div id="settingsPage" class="page page-flow" style="display:none;">
  <div class="page-content">
    <h2>Ajustes</h2>
    <div id="settingsContent"></div>
  </div>
</div>

<!-- MERMAS -->
<div id="mermaPage" class="page page-flow" style="display:none;">
  <div class="page-content">
    <h2 style="margin:0 0 4px;">Mermas</h2>
    <div id="mermaList"></div>
  </div>
</div>

<!-- Floating action buttons (bottom right), shown per page from showPage() -->
<button id="editFab" class="fab fab-icon fab-edit" onclick="toggleEditMode()" title="Editar ventas" style="display:none;"><span data-icon="pencil"></span></button>
<button id="priceFab" class="fab fab-icon fab-upper" onclick="openPricesModal()" title="Precios" style="display:none;"><span data-icon="tag"></span></button>
<button id="hideFab" class="fab fab-icon fab-hide" onclick="toggleHideMode()" title="Ocultar productos" style="display:none;"><span data-icon="eye"></span></button>

<button id="mermaFab" class="fab" onclick="openMermaModal()" title="Registrar merma" style="display:none;">+</button>

<!-- FAB: only visible on promo page, toggled via JS -->
<button id="promoFab" class="fab" onclick="openPromoModal()" title="Agregar promoción" style="display:none;">+</button>

<!-- MENÚ -->
<div id="sideMenu" class="side-menu">
  <div class="menu-content">
    <h3>Menú</h3>
    <button class="active" data-page="pos" onclick="showPage('pos')">Caja</button>
    <button data-page="pending" onclick="showPage('pending')">Pedidos pendientes</button>
    <button data-page="history" onclick="showPage('history')">Historial</button>
    <button data-page="archive" onclick="showPage('archive')">Archivo</button>
    <button data-page="inventory" onclick="showPage('inventory')">Inventario</button>
    <button data-page="promos" onclick="showPage('promos')">Promociones</button>
    <button data-page="mermas" onclick="showPage('mermas')">Mermas</button>
    <hr style="border:none;border-top:1px solid var(--border);margin:12px 0;">
    <button data-page="settings" onclick="showPage('settings')">Ajustes</button>
  </div>
</div>
<!-- Catches taps outside the open menu so they only close it -->
<div class="menu-backdrop" onclick="document.getElementById('sideMenu').classList.remove('open')"></div>

<!-- Floating shortcut to the stats at the bottom of Historial -->
<button id="statsJumpBtn" class="stats-jump" onclick="scrollToStats()"><span data-icon="chevronsDown"></span> Resumen</button>

<!-- Floating save button for Ajustes (shown only when there are unsaved changes) -->
<div id="settingsSaveBar" class="settings-savebar">
  <button id="settingsSaveBtn" class="btn-brand" onclick="saveSettingsChanges()"><span data-icon="save"></span> <span id="settingsSaveLabel">Guardar cambios</span></button>
</div>

<div id="ticket-container" style="position: fixed; left: -9999px; top: 0;"></div>

<div id="pageSpinner" class="page-spinner" style="display:none;"></div>

</div><!-- /appShell -->

<script src="vendor/firebase/firebase-app-compat.js"></script>
<script src="vendor/firebase/firebase-auth-compat.js"></script>
<script src="vendor/firebase/firebase-firestore-compat.js"></script>
<script src="html2canvas.min.js" defer></script>
<script src="app.js"></script>

</body>
</html>
