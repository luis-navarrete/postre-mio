<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Postre Mío</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
</head>

<body>

<!-- AUTH GATE -->
<div id="authGate" class="auth-gate">
  <img src="logo.jpeg">
  <p class="auth-subtitle" id="authSubtitle">Ingresa el PIN para continuar</p>
  <div class="pin-dots" id="pinDots">
    <div class="pin-dot"></div>
    <div class="pin-dot"></div>
    <div class="pin-dot"></div>
    <div class="pin-dot"></div>
  </div>
  <div class="auth-error" id="authError"></div>
  <div class="numpad">
    <button class="numpad-btn" onclick="pinKey('1')">1</button>
    <button class="numpad-btn" onclick="pinKey('2')">2</button>
    <button class="numpad-btn" onclick="pinKey('3')">3</button>
    <button class="numpad-btn" onclick="pinKey('4')">4</button>
    <button class="numpad-btn" onclick="pinKey('5')">5</button>
    <button class="numpad-btn" onclick="pinKey('6')">6</button>
    <button class="numpad-btn" onclick="pinKey('7')">7</button>
    <button class="numpad-btn" onclick="pinKey('8')">8</button>
    <button class="numpad-btn" onclick="pinKey('9')">9</button>
    <button class="numpad-btn empty"></button>
    <button class="numpad-btn" onclick="pinKey('0')">0</button>
    <button class="numpad-btn backspace" onclick="pinBackspace()">⌫</button>
  </div>
</div>

<div id="loadingScreen" class="loading-screen" style="display:none;">
  <img src="icon-192.png">
  <div class="loading-spinner"></div>
</div>

<div id="appShell" style="display:none;">

<div class="header">
  <button class="menu-btn" onclick="toggleMenu()">☰</button>
  <img src="logo.jpeg" onclick="showPage('pos')" style="cursor:pointer;">
  <span id="connBadge" class="conn-badge online">En línea</span>
</div>


<!-- 🟢 PÁGINA PRINCIPAL -->
<div id="posPage" class="page" style="display:block;">

  <div class="container">

    <div class="products" id="products"></div>

    <div class="cart">
      <h2>🛒 Orden</h2>
      <div class="cart-items" id="cart"></div>
      <div class="total">Total: $<span id="total">0</span></div>

      <button id="payBtn" class="pay" onclick="openPaymentOptions();">Cobrar</button>
      <button class="clear" onclick="clearCart()">Limpiar</button>
      <button class="btn-secondary" onclick="saveAsPending()" style="font-size:13px;padding:10px;">📋 Guardar como pendiente</button>
    </div>

  </div>

</div>

<!-- MODAL -->
<div id="modal" class="modal hidden">
  <div class="modal-content" id="modalContent"></div>
</div>

<!-- TICKET -->
<div id="ticketModal" style="
  display:none;
  position:fixed;
  top:10px; bottom:10px;
  left:10px; right:10px;
  width: 100%; height:100%;
  background:rgba(0,0,0,0.6);
  justify-content:center;
  align-items:center;
  z-index:9999;
">
  <div style="
    background:white;
    padding:20px;
    border-radius:10px;
    max-width:320px;
    width:90%;
    text-align:center;
  ">
  </div>
</div>

<!-- INVENTARIO -->
<div id="inventoryPage" class="page" style="display:none;">
  <div class="page-content">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;gap:8px;">
      <h2 style="margin:0;">Inventario</h2>
      <div style="display:flex;gap:8px;align-items:center;flex-shrink:0;">
        <button id="saveInventoryBtn" class="btn-brand" onclick="saveInventoryChanges()" style="display:none;font-size:13px;padding:6px 14px;margin:0;">💾 Guardar</button>
        <button id="cancelInventoryBtn" class="btn-danger" onclick="cancelInventoryChanges()" style="display:none;font-size:13px;padding:6px 14px;margin:0;">Cancelar</button>
        <button class="hide-mode-btn" onclick="openPricesModal()" title="Precios"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg></button>
        <button id="hideModeBtn" class="hide-mode-btn" onclick="toggleHideMode()" title="Ocultar productos"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
      </div>
    </div>
    <div id="inventoryList"></div>
    <div class="restock-section" id="restockSection" style="display:none;">
      <h3>📦 Reabastecimientos</h3>
      <div id="restockList"></div>
      <button class="btn-secondary" style="width:100%;margin-top:10px;font-size:13px;" onclick="clearRestockLog()">Borrar registro</button>
    </div>
    <button class="btn-danger" style="width:100%;margin-top:16px;font-size:13px;" onclick="resetInventory()">Reset</button>
  </div>
</div>

<!-- HISTORIAL -->
<div id="historyPage" class="page" style="display:none;">
  <div class="page-content">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
      <h2 style="margin:0;">Historial</h2>
      <button id="editModeBtn" class="edit-mode-btn" onclick="toggleEditMode()" title="Editar"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>
    </div>
    <div id="historyList"></div>
    <div id="cutBtn" style="display:none; text-align: center;">
      <button onclick="generateCut()">Corte de caja</button>
    </div>
  </div>
</div>

<!-- PROMOCIONES -->
<div id="promoPage" class="page" style="display:none;">
  <div class="page-content">
    <h2>Promociones</h2>
    <div class="promo-list" id="promoList"></div>
  </div>
</div>

<!-- PEDIDOS PENDIENTES -->
<div id="pendingPage" class="page" style="display:none;">
  <div class="page-content">
    <h2>Pedidos pendientes</h2>
    <div class="promo-list" id="pendingList"></div>
  </div>
</div>

<!-- MERMAS -->
<div id="mermaPage" class="page" style="display:none;">
  <div class="page-content">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
      <h2 style="margin:0;">Mermas</h2>
      <button class="btn-secondary" onclick="openCostsModal()" style="font-size:13px;padding:6px 14px;display:flex;align-items:center;gap:6px;"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg> Costos</button>
    </div>
    <div id="mermaList"></div>
  </div>
</div>

<button id="mermaFab" class="fab" onclick="openMermaModal()" title="Registrar merma" style="display:none;">+</button>

<!-- FAB: only visible on promo page, toggled via JS -->
<button id="promoFab" class="fab" onclick="openPromoModal()" title="Agregar promoción" style="display:none;">+</button>

<!-- MENÚ -->
<div id="sideMenu" class="side-menu">
  <div class="menu-content">
    <h3>Menú</h3>
    <button onclick="showPage('pos')">Caja</button>
    <button onclick="showPage('inventory')">Inventario</button>
    <button onclick="showPage('history')">Historial</button>
    <button onclick="showPage('promos')">Promociones</button>
    <button onclick="showPage('pending')">Pedidos pendientes</button>
    <button onclick="showPage('mermas')">Mermas</button>
    <hr style="border:none;border-top:1px solid var(--border);margin:12px 0;">
    <button onclick="logout()" style="color:var(--red);">Cerrar sesión</button>
  </div>
</div>

<div id="ticket-container" style="position: fixed; left: -9999px; top: 0;"></div>

</div><!-- /appShell -->

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="html2canvas.min.js" defer></script>
<script src="app.js"></script>

</body>
</html>
